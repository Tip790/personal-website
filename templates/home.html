{% extends "base.html" %}

{% block content %}
    <h1>My Tasks</h1>
    <p>You have {{ tasks|length }} tasks.</p>

    <ul>
    {% for task in tasks %}
        <li>
            {{ task.title }}
            {% if task.completed %}
                - Completed
            {% else %}
                - In progress
            {% endif %}
        </li>
    {% endfor %}
    </ul>
{% endblock content %}
