<html>
<head>
    <title>Task Manager</title>
</head>
<body>
    <nav>
        <a href="/">Home</a> |
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
    </nav>

    <h1>My Tasks</h1>
    <p>You have {{ tasks|length }} tasks.</p>

    <ul>
    {% for task in tasks %}
        <li>
            {{ task.title }}
            {% if task.done %}
                - done
            {% else %}
                - not done
            {% endif %}
        </li>
    {% endfor %}
    </ul>
</body>
</html>
